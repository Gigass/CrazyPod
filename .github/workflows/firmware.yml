name: CrazyPod firmware only

# Iterating on firmware for a device that already has a full install: only
# rockbox.ipod needs replacing, so build that alone and upload about 2 MB
# instead of the several hundred the packaged build produces.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Target to build
        type: choice
        options:
          - ipodvideo
          - ipod6g
        default: ipodvideo

permissions:
  contents: read

jobs:
  firmware:
    name: ${{ inputs.target }} firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # No Node and no zip here: --firmware-only builds neither the Mini App
      # payloads nor the packaged archive.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            make \
            perl \
            python3

      - name: Build ${{ inputs.target }} firmware
        shell: bash
        run: |
          set -o pipefail
          if ! ./build-hw.sh --target "${{ inputs.target }}" --firmware-only \
              2>&1 | tee build-hw.log; then
            {
              echo '## Firmware build log (tail)'
              echo '```text'
              tail -n 120 build-hw.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: crazypod-${{ inputs.target }}-rockbox-ipod
          if-no-files-found: error
          path: build-hw-${{ inputs.target }}/rockbox.ipod
