name: CrazyPod build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardware:
    name: ${{ matrix.label }} firmware
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ipod6g
            label: iPod 6G
            package: CrazyPod-6G.zip
          # Bring-up target: compiles and packages, not hardware certified.
          - target: ipodvideo
            label: iPod Video (5G)
            package: CrazyPod-5G.zip
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libfreetype6-dev \
            libnewlib-arm-none-eabi \
            make \
            perl \
            pkg-config \
            python3 \
            zip

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/miniapp-builder/package-lock.json

      - name: Build host font converter
        shell: bash
        run: make -C tools convttf

      - name: Build ${{ matrix.label }} firmware
        shell: bash
        run: |
          set -o pipefail
          if ! ./build-hw.sh --target "${{ matrix.target }}" 2>&1 \
              | tee build-hw.log; then
            {
              echo '## Hardware build log (tail)'
              echo '```text'
              tail -n 120 build-hw.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # The iPod Video installs its bootloader with ipodpatcher rather than
      # the 6G's DFU/NOR path, so ship the bootloader image alongside the
      # firmware. build-bootloader.sh covers the 6G NOR path only.
      - name: Build iPod Video bootloader
        if: matrix.target == 'ipodvideo'
        shell: bash
        run: |
          mkdir -p build-bootloader-ipodvideo
          cd build-bootloader-ipodvideo
          ../tools/configure --target=ipodvideo --type=b
          make -j"$(nproc)"

      - name: Upload hardware build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazypod-${{ matrix.target }}-build-log
          if-no-files-found: warn
          path: build-hw.log

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crazypod-${{ matrix.target }}-firmware
          if-no-files-found: error
          path: |
            build-hw-${{ matrix.target }}/rockbox.ipod
            build-hw-${{ matrix.target }}/${{ matrix.package }}
            build-bootloader-ipodvideo/bootloader-ipodvideo.ipod
            dist/miniapps/*.cpk

  simulator:
    name: macOS simulator
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install simulator dependencies
        run: |
          brew untap aws/tap || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install freetype sdl2 ffmpeg pkg-config

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/miniapp-builder/package-lock.json

      - name: Build host font converter
        shell: bash
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix freetype)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          make -C tools convttf

      - name: Build simulator
        shell: bash
        run: |
          set -o pipefail
          if ! ./build-sim.sh 2>&1 | tee build-sim.log; then
            {
              echo '## Simulator build log (tail)'
              echo '```text'
              tail -n 120 build-sim.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload simulator build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazypod-macos-build-log
          if-no-files-found: warn
          path: build-sim.log

      - name: Upload simulator artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crazypod-macos-simulator
          if-no-files-found: error
          path: |
            build-sim/rockboxui
            build-sim/CrazyPod Simulator.app
